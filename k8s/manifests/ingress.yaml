apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: tour-app-ingress
  labels:
    app: tour-app
  annotations:
    kubernetes.io/ingress.class: nginx
  namespace: default
spec:
  ingressClassName: nginx
  rules:
    - host: 3.106.182.152.nip.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: tour-app-service
                port:
                  number: 3002
