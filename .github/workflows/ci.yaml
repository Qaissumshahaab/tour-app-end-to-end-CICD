name: Application CI

on:
  push:
    branches:
      - test
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write
  

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      
      
      - name: Scan repository for secrets using gitleaks tool
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


      - name: Install dependencies
        run: npm ci
  
      
      - name: Scan filesystem with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'




      - name: Audit npm dependencies
        run: npm audit --audit-level=high

      - name: Lint code
        run: npm run lint

      - name: Run tests
        run: npm test  

      - name: Build application
        run: npm run build
      
      - name: SonarQube Cloud Scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

       
      - name: Building Docker image
        run: docker build -t tour-app:${{ github.sha }} .

      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: tour-app:${{ github.sha }}
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      # Step 3: Log in to GitHub Container Registry
      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Step 4: Tag the scanned image with the Git commit SHA
      - name: Tag Docker image for GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          IMAGE_NAME=$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')

          docker tag \
            tour-app:${GITHUB_SHA} \
            ghcr.io/${IMAGE_NAME}:${GITHUB_SHA}

      # Step 5: Push the same scanned image and record its digest
      - name: Publish Docker image to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: publish_image
        shell: bash
        run: |
          set -o pipefail

          IMAGE_NAME=$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')
          IMAGE="ghcr.io/${IMAGE_NAME}:${GITHUB_SHA}"

          docker push "$IMAGE" 2>&1 | tee push.log

          DIGEST=$(grep -oE 'digest: sha256:[a-f0-9]+' push.log | tail -n 1 | awk '{print $2}')

          if [ -z "$DIGEST" ]; then
            echo "ERROR: Could not capture the published image digest."
            exit 1
          fi

          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${IMAGE_NAME}@${DIGEST}" >> "$GITHUB_OUTPUT"

          echo "Published image tag: $IMAGE"
          echo "Published image digest: $DIGEST"
          echo "Kubernetes image reference: ghcr.io/${IMAGE_NAME}@${DIGEST}"

      # Step 6: Display the final immutable image reference
      - name: Display published image digest
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          PUBLISHED_IMAGE: ${{ steps.publish_image.outputs.image }}
          IMAGE_DIGEST: ${{ steps.publish_image.outputs.digest }}
        run: |
          echo "Published image:"
          echo "$PUBLISHED_IMAGE"
          echo ""
          echo "Image digest:"
          echo "$IMAGE_DIGEST"





# contents: read This specifies that the workflow is only allowed to view and pull down the repository's files (like cloning the code to run tests). It explicitly blocks the workflow from writing to your repository, pushing new code, or creating releases. This follows the security principle of "least privilege."


# concurrency:
# This block prevents redundant, wasteful, or overlapping workflow runs when multiple updates happen rapidly.

# • group: ci-${{ github.workflow }}-${{ github.ref }}: This creates a unique tracking ID for the job based on the workflow name and the specific branch or Pull Request (github.ref).

# • cancel-in-progress: true-- If you push a new commit to a Pull Request while an older commit's tests are still actively running inside this group, GitHub will instantly terminate the older run and focus resources entirely on the newest commit.

# When you enable cache: npm, GitHub saves a snapshot of your global npm download cache (~/.npm) after a successful run. On subsequent workflow runs, instead of fetching everything over the internet, GitHub pulls the files directly from its internal data centers. also it saves github actions allocated minutes to your account. This is especially useful for large projects with many dependencies, as it can significantly speed up the installation process and reduce the time it takes to run your CI/CD pipeline.