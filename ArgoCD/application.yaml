apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: my-app
  namespace: argocd

spec:

  project: cicd-tour-app-argocd

  source:
    repoURL: https://github.com/Qaissumshahaab/tour-app-end-to-end-CICD.git
    targetRevision: main
    path: k8s/manifests

  destination:
    server: https://kubernetes.default.svc

    namespace: default

  syncPolicy:

    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true